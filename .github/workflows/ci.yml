name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier . --check
      - run: pnpm build

  test:
    name: Story tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic reads the git history to find the baseline to compare against
          fetch-depth: 0
          # Build the PR's own commit, not the merge commit GitHub makes for it
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: ./.github/actions/setup
      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Only snapshot the stories a change can affect (TurboSnap)
          onlyChanged: true
          # Visual changes are reviewed in Chromatic, so they don't fail the run
          exitZeroOnChanges: true
          # What lands on main becomes the new baseline
          autoAcceptChanges: main
